<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренажер: двійкова система</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d2330;--muted:#5d6678;--line:#d8dde6;--accent:#2f5bea;--ok:#1f8a4c;--okbg:#e3f4ea;--bad:#c93232;--badbg:#fbe6e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b202b;--text:#e8ebf2;--muted:#9aa3b5;--line:#2c3342;--accent:#7c9bff;--ok:#5fd08d;--okbg:#17332500;--bad:#ff7b7b;--badbg:#3a1d1d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b202b;--text:#e8ebf2;--muted:#9aa3b5;--line:#2c3342;--accent:#7c9bff;--ok:#5fd08d;--okbg:#173325;--bad:#ff7b7b;--badbg:#3a1d1d;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;padding:16px}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:1.3rem;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.nav{display:flex;gap:8px;margin-bottom:14px}
.nav button{flex:1;padding:10px 0;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:1rem;font-weight:600;cursor:pointer}
.nav button.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.nav button.ok{background:var(--okbg);color:var(--ok)}
.nav button.bad{background:var(--badbg);color:var(--bad)}
.task{color:var(--muted);margin:0 0 6px}
.bin{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.9rem;font-weight:700;letter-spacing:.08em;word-break:break-all;margin:0 0 4px}
.target{font-weight:600;margin:0 0 14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button{padding:14px 8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.2rem;font-weight:600;cursor:pointer}
.opts button:hover:not(:disabled){border-color:var(--accent)}
.opts button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opts button.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.opts button:disabled{cursor:default}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:.95rem;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.msg{margin-top:14px;padding:12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:.95rem}
.msg.ok{border-color:var(--ok)}.msg.bad{border-color:var(--bad)}
.score{margin-top:12px;color:var(--muted);font-size:.9rem;text-align:center}
.hidden{display:none}
.final{text-align:center}
.final .big{font-size:2.4rem;font-weight:800;margin:6px 0}
</style>
</head>
<body>
<div class="wrap">
<h1>Двійкова система: тренажер</h1>
<div class="nav" id="nav"></div>
<div class="card" id="card"></div>
<div class="score" id="score"></div>
</div>
<script>
var T=[
{bin:"1101",base:10,name:"десяткову",hint:"Кожна цифра — це степінь двійки: 8, 4, 2, 1 (справа наліво).",why:"8 + 4 + 0 + 1 = 13.",wrong:["11","14","12"]},
{bin:"101110",base:8,name:"вісімкову",hint:"Розбийте число на групи по 3 біти справа наліво.",why:"101 | 110 → 5 і 6, тобто 56.",wrong:["65","46","54"]},
{bin:"11111010",base:16,name:"шістнадцяткову",hint:"Розбийте число на групи по 4 біти. Пам’ятайте: 10 = A, 15 = F.",why:"1111 | 1010 → F і A, тобто FA.",wrong:["AF","F5","EA"]},
{bin:"10110101",base:10,name:"десяткову",hint:"Додайте степені двійки там, де стоїть 1: 128, 64, 32, 16, 8, 4, 2, 1.",why:"128 + 32 + 16 + 4 + 1 = 181.",wrong:["171","183","179"]},
{bin:"1100111011",base:16,name:"шістнадцяткову",hint:"Групи по 4 біти справа наліво; зліва доповніть нулями: 0011 0011 1011.",why:"0011 | 0011 | 1011 → 3, 3, B, тобто 33B.",wrong:["3B3","338","37B"]}
];
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var state=[],cur=0;
function init(){
 state=T.map(function(t){
  var c=parseInt(t.bin,2).toString(t.base).toUpperCase();
  return {correct:c,opts:shuffle([c].concat(t.wrong)),picked:null,hint:false};
 });
 cur=0;render();
}
function render(){
 var nav=document.getElementById("nav");nav.innerHTML="";
 T.forEach(function(t,i){
  var b=document.createElement("button");b.textContent=i+1;
  var s=state[i];
  var cls=[];if(i===cur)cls.push("cur");
  if(s.picked!==null)cls.push(s.picked===s.correct?"ok":"bad");
  b.className=cls.join(" ");
  b.onclick=function(){cur=i;render()};
  nav.appendChild(b);
 });
 var t=T[cur],s=state[cur],card=document.getElementById("card");
 var done=state.every(function(x){return x.picked!==null});
 var h='<p class="task">Завдання '+(cur+1)+' з '+T.length+'</p>'+
  '<p class="bin">'+t.bin+'<sub style="font-size:.9rem">2</sub></p>'+
  '<p class="target">Переведіть у '+t.name+' систему (основа '+t.base+')</p><div class="opts">';
 s.opts.forEach(function(o){
  var c="";
  if(s.picked!==null){if(o===s.correct)c="right";else if(o===s.picked)c="wrong"}
  h+='<button class="'+c+'" '+(s.picked!==null?"disabled":"")+' data-v="'+o+'">'+o+'</button>';
 });
 h+='</div>';
 if(s.picked!==null){
  var ok=s.picked===s.correct;
  h+='<div class="msg '+(ok?"ok":"bad")+'"><b>'+(ok?"Правильно!":"Не зовсім. Правильна відповідь: "+s.correct)+'</b><br>'+t.why+'</div>';
 }else if(s.hint){
  h+='<div class="msg">Підказка: '+t.hint+'</div>';
 }
 h+='<div class="row">';
 if(s.picked===null)h+='<button class="btn" id="hintBtn">Підказка</button>';
 h+='<button class="btn" id="prev" '+(cur===0?"disabled":"")+'>← Назад</button>';
 h+='<button class="btn primary" id="next" '+(cur===T.length-1?"disabled":"")+'>Далі →</button></div>';
 if(done){
  var n=state.filter(function(x){return x.picked===x.correct}).length;
  h+='<div class="msg final"><div>Ваш результат</div><div class="big">'+n+' / '+T.length+'</div><button class="btn primary" id="again">Почати знову</button></div>';
 }
 card.innerHTML=h;
 card.querySelectorAll(".opts button").forEach(function(b){
  b.onclick=function(){state[cur].picked=b.getAttribute("data-v");render()};
 });
 var hb=document.getElementById("hintBtn");if(hb)hb.onclick=function(){state[cur].hint=true;render()};
 document.getElementById("prev").onclick=function(){if(cur>0){cur--;render()}};
 document.getElementById("next").onclick=function(){if(cur<T.length-1){cur++;render()}};
 var ag=document.getElementById("again");if(ag)ag.onclick=init;
 var answered=state.filter(function(x){return x.picked!==null}).length;
 document.getElementById("score").textContent="Відповіли: "+answered+" з "+T.length;
}
init();
</script>
</body>
</html>
